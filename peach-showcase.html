<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEACH 쇼케이스</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, sans-serif; }

  /* ── 2:1 고정 캔버스 (1200×600) — 카드에 cover로 들어가도 잘리지 않음 ── */
  .ps-stage {
    position: relative;
    width: 1200px;
    height: 600px;
    overflow: hidden;
    box-sizing: border-box;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(255,95,126,0.14), transparent 55%),
      linear-gradient(140deg, #ffffff 0%, #fff6f8 46%, #ffffff 100%);
  }
  .ps-stage * { box-sizing: border-box; }

  /* 은은한 배경 블롭 (링 아님 — 부드러운 채움) */
  .ps-blob {
    position: absolute;
    border-radius: 999px;
    filter: blur(60px);
    pointer-events: none;
  }
  .ps-blob-1 { width: 420px; height: 420px; left: 8%;  top: 30%; background: rgba(255,95,126,0.10); }
  .ps-blob-2 { width: 360px; height: 360px; right: 6%; top: 8%;  background: rgba(255,150,120,0.08); }

  /* 상단 라벨 */
  .ps-eyebrow {
    position: absolute;
    left: 56px; top: 46px;
    z-index: 6;
  }
  .ps-eyebrow .k {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border: 1px solid rgba(255,95,126,0.22);
    border-radius: 999px;
    background: rgba(255,255,255,0.7);
    color: #ff3d64;
    font-size: 15px; font-weight: 800; letter-spacing: -0.02em;
  }
  .ps-eyebrow .k::before {
    content: ""; width: 8px; height: 8px; border-radius: 999px;
    background: #ff3d64; box-shadow: 0 0 0 4px rgba(255,61,100,0.16);
  }

  /* SVG 연결선 레이어 */
  .ps-links { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .ps-links path {
    fill: none;
    stroke: rgba(255,95,126,0.55);
    stroke-width: 2.5;
    stroke-dasharray: 7 7;
    stroke-linecap: round;
    animation: psDash 1s linear infinite;
  }
  @keyframes psDash { to { stroke-dashoffset: -28; } }
  .ps-flow-dot { fill: #ff3d64; }

  /* ── 중앙 디바이스 (브라우저 프레임 + 실제 대시보드) ── */
  .ps-device {
    position: absolute;
    left: 330px; top: 150px;
    width: 540px; height: 320px;
    z-index: 4;
    border-radius: 20px;
    background: #ffffff;
    border: 1px solid rgba(20,20,20,0.06);
    box-shadow: 0 40px 80px rgba(255,95,126,0.18), 0 10px 30px rgba(20,20,20,0.08);
    overflow: hidden;
    animation: psFloat 6s ease-in-out infinite;
  }
  .ps-topbar {
    height: 44px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(20,20,20,0.05);
    background: #fff;
  }
  .ps-dot { width: 11px; height: 11px; border-radius: 999px; }
  .ps-dot.r { background: #ff5f57; }
  .ps-dot.y { background: #febc2e; }
  .ps-dot.g { background: #28c840; }
  .ps-url {
    margin: 0 auto;
    font-size: 13px; color: #9aa0a6; font-weight: 600;
    background: #f4f5f7; border-radius: 999px; padding: 5px 20px;
    letter-spacing: -0.01em;
  }
  .ps-live { font-size: 12px; font-weight: 800; color: #ff3d64; letter-spacing: -0.01em; }
  .ps-live::after {
    content: ""; display: inline-block; margin-left: 6px;
    width: 7px; height: 7px; border-radius: 999px; background: #ff3d64; vertical-align: middle;
  }
  .ps-screen {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    display: block;
  }

  /* ── 플로팅 카드 ── */
  .ps-card {
    position: absolute;
    z-index: 5;
    width: 258px;
    padding: 20px 22px;
    display: flex; align-items: center; gap: 15px;
    border: 1px solid rgba(255,126,154,0.16);
    border-radius: 22px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 22px 54px rgba(255,95,126,0.14);
    backdrop-filter: blur(14px);
    transition: transform .45s ease, box-shadow .45s ease, border-color .45s ease;
  }
  .ps-card.on {
    transform: translateY(-6px) scale(1.03);
    border-color: rgba(255,95,126,0.42);
    box-shadow: 0 30px 70px rgba(255,95,126,0.24);
  }
  .ps-c1 { left: 40px;  top: 152px; }
  .ps-c2 { left: 892px; top: 152px; }
  .ps-c3 { left: 892px; top: 372px; }
  .ps-c4 { left: 40px;  top: 372px; }

  .ps-ic {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center;
    background:
      radial-gradient(circle at 34% 24%, rgba(255,255,255,0.9), transparent 32%),
      linear-gradient(135deg, #ff7d99 0%, #ff5575 100%);
    box-shadow: 0 12px 26px rgba(255,85,117,0.26);
  }
  .ps-ic svg { width: 26px; height: 26px; fill: #fff; }
  .ps-t { margin: 0 0 6px; color: #141414; font-size: 18px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
  .ps-d { margin: 0; color: #767676; font-size: 13.5px; font-weight: 500; line-height: 1.45; letter-spacing: -0.02em; }

  /* 하단 스텝 인디케이터 (안전 영역 안) */
  .ps-steps {
    position: absolute;
    left: 50%; bottom: 30px; transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    border: 1px solid rgba(255,126,154,0.16);
    border-radius: 999px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 44px rgba(255,95,126,0.12);
  }
  .ps-steps .lbl { font-size: 14px; font-weight: 700; color: #555; letter-spacing: -0.03em; }
  .ps-steps .dots { display: flex; align-items: center; gap: 7px; }
  .ps-sd { width: 8px; height: 8px; border-radius: 999px; background: #ffd3dc; transition: width .35s ease, background .35s ease; }
  .ps-sd.on { width: 26px; background: #ff3d64; }

  @keyframes psFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>

<div class="ps-stage">
  <div class="ps-blob ps-blob-1"></div>
  <div class="ps-blob ps-blob-2"></div>

  <div class="ps-eyebrow"><span class="k">리드 + 광고 인텔리전스</span></div>

  <!-- 연결선: 디바이스 → 각 카드 (점선 + 흐르는 점 + 화살표) -->
  <svg class="ps-links" viewBox="0 0 1200 600" preserveAspectRatio="none">
    <defs>
      <marker id="psArrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
        <path d="M1,1 L8,4.5 L1,8 Z" fill="#ff3d64"></path>
      </marker>
    </defs>

    <!-- → 타겟 수집 (왼쪽 위) -->
    <path id="lk1" d="M330,225 C305,212 300,205 302,203" marker-end="url(#psArrow)"></path>
    <!-- → 경쟁 광고 조회 (오른쪽 위) -->
    <path id="lk2" d="M870,225 C895,212 900,205 888,203" marker-end="url(#psArrow)"></path>
    <!-- → 영업 우선순위 (오른쪽 아래) -->
    <path id="lk3" d="M870,395 C895,408 900,415 888,417" marker-end="url(#psArrow)"></path>
    <!-- → 랜딩 빌더 (왼쪽 아래) -->
    <path id="lk4" d="M330,395 C305,408 300,415 302,417" marker-end="url(#psArrow)"></path>

    <circle class="ps-flow-dot" r="4"><animateMotion dur="1.9s" repeatCount="indefinite"><mpath href="#lk1"/></animateMotion></circle>
    <circle class="ps-flow-dot" r="4"><animateMotion dur="1.9s" begin="0.3s" repeatCount="indefinite"><mpath href="#lk2"/></animateMotion></circle>
    <circle class="ps-flow-dot" r="4"><animateMotion dur="1.9s" begin="0.6s" repeatCount="indefinite"><mpath href="#lk3"/></animateMotion></circle>
    <circle class="ps-flow-dot" r="4"><animateMotion dur="1.9s" begin="0.9s" repeatCount="indefinite"><mpath href="#lk4"/></animateMotion></circle>
  </svg>

  <!-- 중앙 디바이스 (대시보드 이미지에 브라우저 크롬 포함) -->
  <div class="ps-device">
    <img class="ps-screen" src="assets/peach/dashboard.png" alt="PEACH 리드 대시보드">
  </div>

  <!-- 플로팅 카드 3개 -->
  <article class="ps-card ps-c1" data-step="0">
    <div class="ps-ic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 4.6 7 13 7 13s7-8.4 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
    </div>
    <div><p class="ps-t">타겟 수집</p><p class="ps-d">키워드로 카페·식당·바버샵<br>연락처를 자동 수집</p></div>
  </article>

  <article class="ps-card ps-c2" data-step="1">
    <div class="ps-ic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3a8 8 0 1 0 5.29 14.03l3.84 3.84 1.41-1.41-3.84-3.84A8 8 0 0 0 11 3Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
    </div>
    <div><p class="ps-t">경쟁 광고 조회</p><p class="ps-d">이 업체가 지금 Meta<br>광고 돌리는지 바로 확인</p></div>
  </article>

  <article class="ps-card ps-c3" data-step="2">
    <div class="ps-ic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h14v2H3V3h2v16Zm3-2V9h3v8H8Zm5 0V5h3v12h-3Zm5 0v-6h3v6h-3Z"/></svg>
    </div>
    <div><p class="ps-t">영업 우선순위</p><p class="ps-d">광고 집행 중인 업체부터<br>우선순위로 정리</p></div>
  </article>

  <article class="ps-card ps-c4" data-step="3">
    <div class="ps-ic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 4v10h14V8H5Zm2.5 2.5h5v2h-5v-2Zm0 3.5h5v2h-5v-2Z"/></svg>
    </div>
    <div><p class="ps-t">랜딩 빌더</p><p class="ps-d">리드에게 제안할 랜딩을<br>즉석에서 조립·출력</p></div>
  </article>

  <!-- 하단 스텝 -->
  <div class="ps-steps">
    <span class="lbl">리드 인텔리전스 흐름</span>
    <span class="dots"><i class="ps-sd on"></i><i class="ps-sd"></i><i class="ps-sd"></i></span>
  </div>
</div>

<script>
  const cards = document.querySelectorAll('.ps-card');
  const dots  = document.querySelectorAll('.ps-sd');
  let step = 0;
  function tick() {
    cards.forEach((c,i) => c.classList.toggle('on', i === step));
    dots.forEach((d,i) => d.classList.toggle('on', i === step));
    step = (step + 1) % cards.length;
  }
  tick();
  setInterval(tick, 1800);
</script>

</body>
</html>
